name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  order-refactor-tests:
    name: OrderRefactor.Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test OrderRefactor.Tests --nologo

  quotes-tests-unit:
    name: Quotes.Tests.Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Quotes.Tests.Unit --nologo

  quotes-tests-integration:
    name: Quotes.Tests.Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Testcontainers.MsSql needs a running Docker daemon; GitHub-hosted ubuntu-latest
      # runners have Docker preinstalled, so no extra setup is required here. First run on a
      # given runner generation pulls mcr.microsoft.com/mssql/server:2022-latest (~5 min);
      # subsequent runs reuse the layer cache.
      - run: dotnet test Quotes.Tests.Integration --nologo
