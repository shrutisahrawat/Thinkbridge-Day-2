name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  order-refactor-tests:
    name: OrderRefactor.Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test OrderRefactor.Tests --nologo

  quotes-tests-unit:
    name: Quotes.Tests.Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Quotes.Tests.Unit --nologo

  quotes-tests-integration:
    name: Quotes.Tests.Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # GitHub-hosted ubuntu runners have Docker preinstalled, which Testcontainers needs.
      # First run pulls mcr.microsoft.com/mssql/server:2022-latest (~5 min).
      - run: dotnet test Quotes.Tests.Integration --nologo
